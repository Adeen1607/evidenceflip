[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceflip"
version = "0.2.0"
description = "DATA INTEGRITY and counterfactual evidence evaluation for RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EvidenceFlip contributors"}]
keywords = ["rag", "evaluation", "data-integrity", "counterfactual-testing", "ai"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.scripts]
evidenceflip = "evidenceflip.cli:main"

[tool.setuptools.packages.find]
include = ["evidenceflip*"]
