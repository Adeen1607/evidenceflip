name: DATA INTEGRITY · CI/CD and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Timezone-aware scheduling preserves 02:00 across daylight saving transitions.
    - cron: '0 2 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: read

concurrency:
  group: evidenceflip-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} · tests and source integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify DATA INTEGRITY source hashes
        run: python -m evidenceflip verify --root .
      - name: Run deterministic counterfactual demo
        run: python -m evidenceflip demo --output evidenceflip-results.json
      - name: Upload evidence audit
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: evidenceflip-audit
          path: evidenceflip-results.json
          retention-days: 7

  pages:
    name: Publish verified interactive portfolio
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build auditable Pages bundle
        run: |
          mkdir -p _site/sources _site/docs
          cp -R site/. _site/
          cp -R sources/. _site/sources/
          cp docs/DATA_INTEGRITY.md docs/INTERVIEW_GUIDE.md _site/docs/
          python -m evidenceflip verify --root .
          python -m evidenceflip demo --output _site/evaluation.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
