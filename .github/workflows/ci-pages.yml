name: DATA INTEGRITY · CI only (prelaunch)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily checks during development; no publishing or deployment.
    - cron: '0 2 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: read

concurrency:
  group: evidenceflip-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} · tests and source integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify DATA INTEGRITY source hashes
        run: python -m evidenceflip verify --root .
      - name: Run deterministic counterfactual demo
        run: python -m evidenceflip demo --output evidenceflip-results.json
      - name: Run author-labeled synthetic retrieval benchmark
        run: python -m evidenceflip.rag_cli benchmark --set examples/retrieval_benchmark.json --top-k 3 > retrieval-audit.json
      - name: Upload evidence audit
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: evidenceflip-audit
          path: |
            evidenceflip-results.json
            retrieval-audit.json
          retention-days: 7

